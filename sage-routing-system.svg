<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">SAGE state-aware routing system</title>
  <desc id="desc">A publication-style system diagram showing routing inputs, constrained tri-mode selection, execution planning, and evidence-based online updates.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#2563EB"/>
    </marker>
    <style>
      .t{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#526071}.panel-title{font-size:14px;font-weight:700;letter-spacing:1px}.body{font-size:17px}.small{font-size:15px;fill:#526071}.mode{font-size:17px;font-weight:700}.frame{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5}.card{fill:#FFFFFF;stroke:#D7DEE8;stroke-width:1.25}.edge{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}.feedback{fill:none;stroke:#2563EB;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow-blue)}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="50" y="52" class="t title">SAGE state-aware routing and evidence update loop</text>
  <text x="50" y="82" class="t subtitle">Feasibility constraints precede mode selection; execution evidence updates future routing estimates.</text>

  <path d="M300 356H334" class="edge"/>
  <path d="M850 356H884" class="edge"/>

  <!-- A. Inputs -->
  <g>
    <rect x="50" y="125" width="250" height="455" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="50" y="125" width="250" height="54" rx="8" fill="#E8F0FE"/>
    <path d="M50 171H300" stroke="#CBD5E1"/>
    <text x="68" y="158" class="t panel-title" fill="#1D4ED8">A  ROUTING INPUTS</text>

    <rect x="70" y="203" width="210" height="94" rx="6" class="card"/>
    <g transform="translate(88 227)" fill="none" stroke="#2563EB" stroke-width="3">
      <path d="M0 34H28V8H58V25H88V12H112"/>
      <circle cx="0" cy="34" r="4" fill="#2563EB"/><circle cx="28" cy="8" r="4" fill="#2563EB"/><circle cx="58" cy="25" r="4" fill="#2563EB"/><circle cx="88" cy="12" r="4" fill="#2563EB"/><circle cx="112" cy="12" r="4" fill="#2563EB"/>
    </g>
    <text x="88" y="282" class="t body" font-weight="700">Task DAG</text>
    <text x="176" y="282" class="t small">requirements</text>

    <rect x="70" y="318" width="210" height="94" rx="6" class="card"/>
    <circle cx="108" cy="356" r="20" fill="#0F766E"/>
    <path d="M98 356l7 7 14-17" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
    <text x="140" y="353" class="t body" font-weight="700">Execution state</text>
    <text x="140" y="377" class="t small">progress and failures</text>

    <rect x="70" y="433" width="210" height="118" rx="6" class="card"/>
    <g transform="translate(94 454)">
      <circle cx="18" cy="18" r="15" fill="#D97706"/>
      <circle cx="62" cy="18" r="15" fill="#2563EB"/>
      <circle cx="106" cy="18" r="15" fill="#0F766E"/>
      <path d="M18 36V48M62 36V48M106 36V48" stroke="#475569" stroke-width="2"/>
    </g>
    <text x="94" y="522" class="t body" font-weight="700">Agent evidence</text>
    <text x="94" y="544" class="t small">cards · local scores · bids</text>
  </g>

  <!-- B. Router -->
  <g>
    <rect x="340" y="125" width="510" height="455" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="340" y="125" width="510" height="54" rx="8" fill="#EEF2FF"/>
    <path d="M340 171H850" stroke="#CBD5E1"/>
    <text x="360" y="158" class="t panel-title" fill="#4338CA">B  CONSTRAINED TRI-MODE ROUTER</text>

    <rect x="370" y="204" width="450" height="68" rx="6" fill="#273449"/>
    <text x="595" y="231" text-anchor="middle" fill="#FFFFFF" class="t body" font-weight="700">Hard feasibility gate</text>
    <text x="595" y="255" text-anchor="middle" fill="#E2E8F0" font-family="Arial,Helvetica,sans-serif" font-size="15">permissions · budget · deadline · availability</text>

    <path d="M595 272V300M595 300H430V318M595 300V318M595 300H760V318" fill="none" stroke="#64748B" stroke-width="1.8"/>

    <rect x="370" y="318" width="120" height="92" rx="6" fill="#E8F0FE" stroke="#93B4E8"/>
    <text x="430" y="349" text-anchor="middle" class="t mode" fill="#1D4ED8">SELF</text>
    <text x="430" y="375" text-anchor="middle" class="t small">retain context</text>
    <text x="430" y="397" text-anchor="middle" class="t small">one owner</text>

    <rect x="515" y="318" width="160" height="92" rx="6" fill="#FEF3C7" stroke="#E7B94B"/>
    <text x="595" y="349" text-anchor="middle" class="t mode" fill="#92400E">COLLABORATE</text>
    <text x="595" y="375" text-anchor="middle" class="t small">team search</text>
    <text x="595" y="397" text-anchor="middle" class="t small">DAG roles</text>

    <rect x="700" y="318" width="120" height="92" rx="6" fill="#E7F6F2" stroke="#7DB9AA"/>
    <text x="760" y="349" text-anchor="middle" class="t mode" fill="#0F766E">HANDOFF</text>
    <text x="760" y="375" text-anchor="middle" class="t small">new owner</text>
    <text x="760" y="397" text-anchor="middle" class="t small">transfer cost</text>

    <path d="M430 410V438M595 410V438M760 410V438M430 438H760M595 438V458" fill="none" stroke="#64748B" stroke-width="1.8"/>
    <rect x="370" y="458" width="450" height="84" rx="6" class="card"/>
    <text x="595" y="489" text-anchor="middle" class="t body" font-weight="700">Expected task value − routing penalties</text>
    <text x="595" y="516" text-anchor="middle" class="t small">calibrated success · cost · latency · risk · transfer · uncertainty</text>
  </g>

  <!-- C. Outputs and learning -->
  <g>
    <rect x="890" y="125" width="260" height="455" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="890" y="125" width="260" height="54" rx="8" fill="#E7F6F2"/>
    <path d="M890 171H1150" stroke="#CBD5E1"/>
    <text x="910" y="158" class="t panel-title" fill="#0F766E">C  EXECUTION + LEARNING</text>

    <rect x="915" y="205" width="210" height="130" rx="6" class="card"/>
    <text x="1020" y="237" text-anchor="middle" class="t body" font-weight="700">Inspectable plan</text>
    <path d="M950 278H990M1002 278H1042M1054 278H1094" stroke="#475569" stroke-width="2.5"/>
    <circle cx="950" cy="278" r="9" fill="#2563EB"/><circle cx="1002" cy="278" r="9" fill="#D97706"/><circle cx="1054" cy="278" r="9" fill="#0F766E"/><circle cx="1094" cy="278" r="9" fill="#273449"/>
    <text x="1020" y="315" text-anchor="middle" class="t small">assignment · topology · rationale</text>

    <rect x="915" y="365" width="210" height="162" rx="6" class="card"/>
    <text x="1020" y="397" text-anchor="middle" class="t body" font-weight="700">Evidence updates</text>
    <text x="938" y="432" class="t small">capability trust</text>
    <text x="938" y="461" class="t small">pair synergy</text>
    <text x="938" y="490" class="t small">bid fidelity</text>
    <rect x="1066" y="420" width="36" height="8" rx="4" fill="#2563EB"/>
    <rect x="1066" y="449" width="25" height="8" rx="4" fill="#0F766E"/>
    <rect x="1066" y="478" width="31" height="8" rx="4" fill="#D97706"/>
  </g>

  <path d="M1020 527V606C1020 626 595 626 595 580" class="feedback"/>
  <line x1="50" y1="650" x2="1150" y2="650" stroke="#CBD5E1"/>
  <text x="50" y="676" class="t small"><tspan font-weight="700">System boundary.</tspan> A2A transports tasks; SAGE selects a feasible executor configuration and records the decision rationale.</text>
</svg>
