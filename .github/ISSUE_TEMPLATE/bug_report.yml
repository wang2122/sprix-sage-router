name: Bug report
description: Report reproducible routing, scheduling, learning, or integration behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve SAGE. Remove credentials, private traces, and personal data.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, tag, or package version.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Router and constraints
        - DAG assignment and scheduling
        - Online learning and persistence
        - A2A adapter
        - Benchmark
        - Documentation or CI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized inputs, commands, and the smallest code sample that fails.
      render: python
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed secrets, private task content, proprietary Agent Cards, and personal data.
          required: true
        - label: I searched existing issues for the same behavior.
          required: true
