name: Feature request
description: Propose a focused routing, evaluation, integration, or operations improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, research, or operational problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the API, algorithm, evaluation, or documentation change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and evaluation
      description: What baseline, metric, test, or trace would show that the change works?
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Constraints and risks
      description: Cover permissions, budget, latency, privacy, compatibility, and failure behavior where relevant.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope acknowledgement
      options:
        - label: I understand that synthetic results must not be presented as production evidence.
          required: true
