name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q sprix_sage.py sprix_a2a.py demo.py benchmark.py examples test_sprix_*.py test_benchmark.py
      - run: python -m unittest -v
      - run: python -m pip install .
      - run: python -c "import sprix_sage, sprix_a2a"
      - run: python -m examples.a2a_execution_plan
      - run: python benchmark.py --seeds 3 --tasks-per-seed 25 --json benchmark-smoke.json
      - run: python -c "import json; data=json.load(open('benchmark-smoke.json')); assert data['total_tasks'] == 25"
